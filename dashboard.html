<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#FBFBFC; --sidebar-bg:#FFFFFF;
    --text:#14171F; --muted:#5B6472; --border:#E3E6EB;
    --pos:#0F7B6C; --pos-bg:#E7F5F2;
    --neg:#C1432E; --neg-bg:#FBEAE7;
    --warn:#B4790F; --warn-bg:#FBF1E0;
    --accent:#2B5FD9; --accent-bg:#EAF0FE;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B0E14; --surface:#121620; --surface-2:#161B26; --sidebar-bg:#0E1119;
      --text:#E7E9EE; --muted:#8B93A3; --border:#232837;
      --pos:#34D8B9; --pos-bg:#0E2621;
      --neg:#FF7A63; --neg-bg:#2B1712;
      --warn:#E8B34D; --warn-bg:#2B2312;
      --accent:#6E93F5; --accent-bg:#151E33;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B0E14; --surface:#121620; --surface-2:#161B26; --sidebar-bg:#0E1119;
    --text:#E7E9EE; --muted:#8B93A3; --border:#232837;
    --pos:#34D8B9; --pos-bg:#0E2621;
    --neg:#FF7A63; --neg-bg:#2B1712;
    --warn:#E8B34D; --warn-bg:#2B2312;
    --accent:#6E93F5; --accent-bg:#151E33;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--bg);}
  body{font-family:var(--sans); color:var(--text);}
  button, select, input{font-family:var(--sans);}

  .app-shell{display:flex; min-height:100vh;}
  .sidebar{width:216px; flex:0 0 216px; background:var(--sidebar-bg); border-right:1px solid var(--border); padding:20px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .brand{font-size:14px; font-weight:600; padding:6px 10px 18px; display:flex; align-items:center; gap:8px;}
  .brand .dot{width:8px; height:8px; border-radius:50%; background:var(--accent);}
  .mode-badge{display:none; align-items:center; font-size:10px; font-weight:600; letter-spacing:.04em; color:var(--accent); background:var(--accent-bg); border:1px solid var(--accent); padding:2px 8px; border-radius:20px; margin:0 10px 14px;}
  #sidebarNav{display:flex; flex-direction:column; gap:2px;}
  .nav-item{all:unset; cursor:pointer; font-size:13.5px; padding:9px 12px; border-radius:6px; color:var(--muted); border-left:2px solid transparent;}
  .nav-item:hover{background:var(--surface-2); color:var(--text);}
  .nav-item.active{background:var(--accent-bg); color:var(--accent); font-weight:500; border-left:2px solid var(--accent);}

  .main{flex:1; min-width:0;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 28px; border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:5;}
  .topbar-left{display:flex; align-items:center; gap:10px;}
  .topbar-actions{display:flex; gap:8px;}
  .content{padding:26px 28px 60px; max-width:1320px;}

  button{font-size:13px; font-weight:500; padding:7px 13px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;}
  button:hover{border-color:var(--accent); color:var(--accent);}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.primary:hover{opacity:.9; color:#fff;}
  button:disabled{opacity:.5; cursor:not-allowed;}
  button:disabled:hover{border-color:var(--border); color:var(--text);}
  input[type=file]{display:none;}
  select{font-size:13px; padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text);}

  .page-head{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:14px; margin-bottom:20px;}
  .page-head h1{font-size:20px; font-weight:600; margin:0 0 3px;}
  .page-head .sub{color:var(--muted); font-size:13px; margin:0; max-width:640px;}
  .page-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:22px;}
  .kpi{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:13px 15px;}
  .kpi .label{font-size:11.5px; color:var(--muted); margin-bottom:6px;}
  .kpi .value{font-family:var(--mono); font-size:19px; font-weight:600;}
  .kpi .kpi-sub{font-size:11px; color:var(--muted); margin-top:3px;}

  section{margin-bottom:28px;}
  section h2{font-size:14.5px; font-weight:600; margin:0 0 4px;}
  section > .sub{color:var(--muted); font-size:12.5px; margin:0 0 12px;}
  h3{font-size:14px; font-weight:600; margin:0 0 10px;}

  .charts-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:900px){ .charts-grid{grid-template-columns:1fr;} }
  .chart-card{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px;}
  .chart-title{font-size:13px; font-weight:500; margin-bottom:10px;}
  .chart-body{position:relative; height:260px;}

  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:8px; background:var(--surface);}
  table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px;}
  thead th{position:sticky; top:0; background:var(--surface-2); text-align:right; padding:9px 11px; font-weight:500; color:var(--muted); border-bottom:1px solid var(--border); cursor:pointer; white-space:nowrap; user-select:none;}
  thead th:hover{color:var(--accent);}
  .arrow{font-size:9px; margin-left:3px; opacity:.6;}
  tbody td{padding:8px 11px; text-align:right; border-bottom:1px solid var(--border); font-family:var(--mono); white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.clickable-row{cursor:pointer;}
  tbody tr.clickable-row:hover{background:var(--surface-2);}

  .tag{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-family:var(--sans); font-weight:500; background:var(--surface-2); color:var(--muted); white-space:nowrap;}
  .tag.good{background:var(--pos-bg); color:var(--pos);}
  .tag.bad{background:var(--neg-bg); color:var(--neg);}
  .tag.warn{background:var(--warn-bg); color:var(--warn);}

  .alert-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .alert{font-size:12.5px; padding:9px 12px; border-radius:6px; border-left:3px solid var(--border);}
  .alert-warn{background:var(--warn-bg); border-color:var(--warn); color:var(--text);}
  .alert-danger{background:var(--neg-bg); border-color:var(--neg); color:var(--text);}
  .alert-ok{background:var(--pos-bg); border-color:var(--pos); color:var(--text);}

  .insight-list{list-style:none; margin:0 0 10px; padding:0; display:flex; flex-direction:column; gap:8px; font-size:12.5px;}
  .insight-cat{display:inline-block; font-size:10px; font-weight:600; letter-spacing:.03em; color:var(--accent); background:var(--accent-bg); padding:1px 7px; border-radius:10px; margin-right:7px;}
  .link-btn{all:unset; cursor:pointer; color:var(--accent); font-size:12.5px; font-weight:500;}
  .link-btn:hover{text-decoration:underline;}
  .link-inline{color:var(--accent); cursor:pointer; text-decoration:none; font-size:12.5px;}
  .link-inline:hover{text-decoration:underline;}

  .filter-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .seg{display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden;}
  .seg-btn{border:none; border-radius:0; background:var(--surface);}
  .seg-btn.active{background:var(--accent); color:#fff;}
  .chk{font-size:12.5px; color:var(--muted); display:inline-flex; align-items:center; gap:6px;}

  .chip-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:16px;}
  .stat-chip{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:11px 13px; cursor:pointer;}
  .stat-chip:hover{border-color:var(--accent);}
  .chip-label{font-size:10.5px; color:var(--muted); margin-bottom:5px;}
  .chip-val{font-family:var(--mono); font-size:13px; font-weight:600;}
  .chip-sub{font-size:11px; color:var(--accent); margin-top:2px;}

  .creative-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px;}
  .creative-card{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px; cursor:pointer;}
  .creative-card:hover{border-color:var(--accent);}
  .thumb{height:96px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; font-size:13px; margin-bottom:10px;}
  .cc-id{font-family:var(--mono); font-size:12px; font-weight:600;}
  .cc-creator{font-size:11.5px; color:var(--muted); margin:2px 0 6px;}
  .cc-hook{font-size:11.5px; margin-bottom:8px;}
  .cc-metrics{display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted); font-family:var(--mono);}

  .detail-card{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px; display:flex; gap:14px; align-items:flex-start; margin-bottom:20px;}
  .avatar{width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex:0 0 42px;}
  .detail-name{font-size:15px; font-weight:600;}
  .detail-meta{font-size:12.5px; color:var(--muted); margin-top:3px;}
  .budget-bar{height:6px; background:var(--surface-2); border-radius:4px; margin:10px 0 6px; overflow:hidden; max-width:320px;}
  .budget-fill{height:100%; background:var(--accent);}

  .subtabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px; flex-wrap:wrap;}
  .subtab{all:unset; cursor:pointer; font-size:12.5px; padding:8px 12px; color:var(--muted); border-bottom:2px solid transparent;}
  .subtab:hover{color:var(--text);}
  .subtab.active{color:var(--accent); border-bottom:2px solid var(--accent); font-weight:500;}

  .insight-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin-bottom:26px;}
  .insight-card{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px;}
  .insight-text{font-size:13px; line-height:1.5; margin:6px 0 6px;}
  .insight-detail{font-size:11px; color:var(--muted); font-family:var(--mono);}

  .source-row{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border:1px solid var(--border); border-radius:8px; background:var(--surface); margin-bottom:8px;}
  .source-name{font-size:13px; font-weight:500;}
  .source-desc{font-size:11.5px; color:var(--muted); margin-top:2px;}

  .report{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:26px;}
  .report-head h2{font-size:18px; margin:0 0 3px;}
  .rec-list{margin:0; padding-left:18px; font-size:13px; line-height:1.9;}

  .empty{border:1px dashed var(--border); border-radius:8px; padding:24px 20px; text-align:center; color:var(--muted); font-size:13px;}
  .empty.big{padding:50px 20px;}
  .empty.big p{margin:0 0 10px;}
  .foot-note{font-size:11.5px; color:var(--muted); margin-top:10px;}

  @media (max-width:760px){
    .app-shell{flex-direction:column;}
    .sidebar{width:100%; flex:none; height:auto; position:relative; border-right:none; border-bottom:1px solid var(--border);}
    #sidebarNav{flex-direction:row; flex-wrap:wrap;}
    .content{padding:20px 16px 50px;}
    table{min-width:560px;}
  }

  @media print{
    .sidebar, .topbar, .page-actions, .subtabs{display:none !important;}
    .app-shell{display:block;}
    .content{padding:0; max-width:none;}
    body{background:#fff; color:#000;}
  }

<style>
.rec-card{transition:transform .15s ease,border-color .15s ease}
.rec-card:hover{transform:translateY(-1px)}
.brief-editor{max-width:900px}
.brief-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.brief-grid label,.brief-editor label{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.brief-grid input,.brief-grid select,.brief-editor textarea,.brief-editor input{display:block;width:100%;margin-top:6px;box-sizing:border-box;padding:9px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit}
@media(max-width:700px){.brief-grid{grid-template-columns:1fr}}

<style>
.workflow-pipeline{display:grid;grid-template-columns:repeat(8,minmax(80px,1fr));gap:8px;margin:14px 0 4px}
.workflow-step{border:1px solid var(--border);border-radius:8px;padding:10px 8px;background:var(--surface);text-align:center}
.workflow-step strong{display:block;font-size:20px}.workflow-step span{display:block;margin-top:4px;font-size:10px;opacity:.7}
.workflow-card{display:flex;align-items:center;gap:14px;margin-bottom:9px}
.workflow-card button{white-space:nowrap}
@media(max-width:900px){.workflow-pipeline{grid-template-columns:repeat(4,1fr)}}
@media(max-width:600px){.workflow-pipeline{grid-template-columns:repeat(2,1fr)}.workflow-card{align-items:flex-start;flex-direction:column}}
</style>
</style>
</style>

</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span>Creator Performance</div>
    <div id="modeIndicator" class="mode-badge"></div>
    <nav id="sidebarNav"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left"></div>
      <div class="topbar-actions">
        <button id="btnSample">Load sample data</button>
        <button id="btnUpload" class="primary">Upload CSV</button>
        <button id="btnClear">Clear</button>
        <input type="file" id="fileInput" accept=".csv">
      </div>
    </div>
    <div class="content" id="pageContent"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script>
// ---------- Seeded RNG (mulberry32) so demo data is stable across a session ----------
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(42);
function rand(min, max) { return min + rng() * (max - min); }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }
function round2(n) { return Math.round(n * 100) / 100; }

// ---------- Reference config ----------
var HOOKS = ['Testimonial', 'Product demo', 'Problem/solution', 'Before & after', 'Founder story', 'UGC unboxing'];
var ANGLES = ['Social proof', 'Pain point', 'Curiosity', 'Urgency/offer', 'Educational', 'Lifestyle'];
var FORMATS = ['UGC video', 'Studio video', 'Static image', 'Carousel', 'Meme/text'];
var CTAS = ['Shop now', 'Learn more', 'Get offer', 'Sign up'];
var PLATFORMS = ['Instagram', 'TikTok', 'YouTube', 'Facebook'];
var AUTH_TYPES = ['Organic usage rights', 'Paid usage rights (whitelisting)', 'Full buyout'];
var NICHES = ['Beauty', 'Fitness', 'Home & lifestyle', 'Tech', 'Fashion', 'Food', 'Parenting', 'Finance'];
var LOCATIONS = ['Los Angeles, US', 'Austin, US', 'London, UK', 'Toronto, CA', 'Sydney, AU', 'Berlin, DE', 'Miami, US', 'Chicago, US'];
var PLACEMENTS = ['Feed', 'Reels', 'Stories', 'Audience Network'];

var HOOK_CTR_MULT = { 'Testimonial': 1.28, 'UGC unboxing': 1.22, 'Before & after': 1.15, 'Founder story': 1.05, 'Problem/solution': 1.0, 'Product demo': 0.85 };
var ANGLE_CTR_MULT = { 'Urgency/offer': 1.15, 'Curiosity': 1.12, 'Social proof': 1.08, 'Lifestyle': 1.0, 'Pain point': 0.95, 'Educational': 0.9 };
var FORMAT_CTR_MULT = { 'UGC video': 1.2, 'Carousel': 1.05, 'Studio video': 1.0, 'Meme/text': 0.95, 'Static image': 0.8 };

var HOOK_CPA_MULT = { 'Testimonial': 0.85, 'UGC unboxing': 0.9, 'Before & after': 0.95, 'Founder story': 1.0, 'Problem/solution': 1.05, 'Product demo': 1.2 };
var ANGLE_CPA_MULT = { 'Social proof': 0.85, 'Urgency/offer': 0.9, 'Pain point': 0.95, 'Curiosity': 1.0, 'Lifestyle': 1.05, 'Educational': 1.15 };
var LEN_CPA_MULT = { '<15s': 1.05, '15-30s': 0.82, '30-60s': 0.95, '60s+': 1.15 };

function lengthBucket(seconds) {
  if (seconds < 15) return '<15s';
  if (seconds < 30) return '15-30s';
  if (seconds < 60) return '30-60s';
  return '60s+';
}

// ---------- Data generation ----------
function generateDemoData() {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var DAYS = 30;

  var creators = [];
  for (var i = 0; i < 8; i++) {
    creators.push({
      id: 'cr' + i,
      name: pick(['Maya Chen', 'Jordan Lee', 'Priya Nair', 'Sam Okafor', 'Elena Petrova', 'Diego Ramos', 'Aisha Bello', 'Kenji Watanabe'].slice(i, i + 1)) || ('Creator ' + (i + 1)),
      followers: randInt(18000, 620000),
      niche: NICHES[i % NICHES.length],
      location: LOCATIONS[i % LOCATIONS.length],
      quality: rand(0.85, 1.2), // per-creator skill multiplier (lower CPA, higher CTR when > 1)
      color: pick(['#2B5FD9', '#0F7B6C', '#C1432E', '#9757D7', '#D98A2B', '#2BA0D9', '#D92B6B', '#4C9F2B'])
    });
  }
  creators[0].name = 'Maya Chen'; creators[1].name = 'Jordan Lee'; creators[2].name = 'Priya Nair';
  creators[3].name = 'Sam Okafor'; creators[4].name = 'Elena Petrova'; creators[5].name = 'Diego Ramos';
  creators[6].name = 'Aisha Bello'; creators[7].name = 'Kenji Watanabe';

  var campaignNames = ['Spring conversions', 'Retargeting always-on', 'New market launch', 'Holiday push'];
  var campaigns = campaignNames.map(function (name, i) {
    return {
      id: 'cp' + i,
      name: name,
      objective: pick(['Conversions', 'Conversions', 'Catalog sales']),
      budget: randInt(35000, 95000),
      status: i === 3 ? 'Scheduled' : (i === 2 ? 'Paused' : 'Active'),
      aov: rand(85, 165)
    };
  });

  var creatives = [];
  for (var c = 0; c < 40; c++) {
    var creatorId = 'cr' + (c % 8);
    var campaignId = 'cp' + (c % 4);
    var hook = pick(HOOKS), angle = pick(ANGLES), format = pick(FORMATS), cta = pick(CTAS);
    var videoLength = format.indexOf('image') >= 0 || format.indexOf('Meme') >= 0 ? 0 : randInt(8, 75);
    var bucket = format.indexOf('image') >= 0 || format.indexOf('Meme') >= 0 ? 'n/a' : lengthBucket(videoLength);
    creatives.push({
      id: 'cv' + (c + 1),
      creatorId: creatorId,
      campaignId: campaignId,
      hook: hook, angle: angle, format: format, cta: cta,
      videoLength: videoLength, lengthBucket: bucket,
      launchDate: addDays(today, -randInt(5, 28)),
      ctrBase: 0.012 * (HOOK_CTR_MULT[hook] || 1) * (ANGLE_CTR_MULT[angle] || 1) * (FORMAT_CTR_MULT[format] || 1),
      cpaBase: 30 * (HOOK_CPA_MULT[hook] || 1) * (ANGLE_CPA_MULT[angle] || 1) * (LEN_CPA_MULT[bucket] || 1),
      cpmBase: rand(9, 19)
    });
  }

  // apply creator quality after creatives exist
  creatives.forEach(function (cv) {
    var creator = creators.filter(function (x) { return x.id === cv.creatorId; })[0];
    cv.ctrBase = cv.ctrBase * (0.7 + creator.quality * 0.3);
    cv.cpaBase = cv.cpaBase / (0.7 + creator.quality * 0.3);
  });

  var ads = [];
  var dailyRows = [];
  creatives.forEach(function (cv) {
    var campaign = campaigns.filter(function (x) { return x.id === cv.campaignId; })[0];
    var numAds = 2;
    for (var a = 0; a < numAds; a++) {
      var adId = cv.id + '-ad' + (a + 1);
      var placement = PLACEMENTS[(ads.length) % PLACEMENTS.length];
      ads.push({ id: adId, creativeId: cv.id, creatorId: cv.creatorId, campaignId: cv.campaignId, placement: placement });

      var baseDailySpend = rand(18, 70);
      for (var d = DAYS - 1; d >= 0; d--) {
        var date = addDays(today, -d);
        var noise = rand(0.75, 1.25);
        var spend = round2(baseDailySpend * noise * (0.9 + 0.2 * Math.sin(d / 4)));
        var impressions = Math.round((spend / cv.cpmBase) * 1000);
        var clicks = Math.round(impressions * cv.ctrBase * rand(0.85, 1.15));
        clicks = Math.max(clicks, spend > 0 ? 1 : 0);
        var purchases = Math.round((spend / cv.cpaBase) * rand(0.8, 1.2));
        purchases = Math.max(0, purchases);
        var revenue = round2(purchases * campaign.aov * rand(0.9, 1.1));

        dailyRows.push({
          date: fmtDate(date), adId: adId, creativeId: cv.id, creatorId: cv.creatorId, campaignId: cv.campaignId,
          spend: spend, impressions: impressions, clicks: clicks, purchases: purchases, revenue: revenue
        });
      }
    }
  });

  // Rights management: one record per creative
  var rights = creatives.map(function (cv, i) {
    var start = addDays(cv.launchDate, -randInt(0, 10));
    var expiryOffset;
    var mod = i % 10;
    if (mod === 0) expiryOffset = -randInt(1, 20);       // expired
    else if (mod === 1 || mod === 2) expiryOffset = randInt(1, 7);   // expiring this week
    else if (mod === 3 || mod === 4) expiryOffset = randInt(8, 30);  // expiring this month
    else expiryOffset = randInt(31, 240);                 // healthy
    var expiry = addDays(today, expiryOffset);
    return {
      creativeId: cv.id, creatorId: cv.creatorId,
      platform: PLATFORMS[i % PLATFORMS.length],
      authType: AUTH_TYPES[i % AUTH_TYPES.length],
      startDate: fmtDate(start), expiryDate: fmtDate(expiry),
      daysRemaining: expiryOffset
    };
  });

  return { creators: creators, campaigns: campaigns, creatives: creatives, ads: ads, dailyRows: dailyRows, rights: rights, generatedAt: fmtDate(today) };
}

function addDays(date, n) { var d = new Date(date); d.setDate(d.getDate() + n); return d; }
function fmtDate(d) { return d.toISOString().slice(0, 10); }

// ---------- Aggregation ----------
function aggregate(rows) {
  var spend = 0, impressions = 0, clicks = 0, purchases = 0, revenue = 0;
  for (var i = 0; i < rows.length; i++) {
    spend += rows[i].spend; impressions += rows[i].impressions; clicks += rows[i].clicks;
    purchases += rows[i].purchases; revenue += rows[i].revenue;
  }
  var ctr = impressions ? clicks / impressions : 0;
  var cpc = clicks ? spend / clicks : 0;
  var cpm = impressions ? (spend / impressions) * 1000 : 0;
  var cpa = purchases ? spend / purchases : 0;
  var roas = spend ? revenue / spend : 0;
  var cvr = clicks ? purchases / clicks : 0;
  return { spend: spend, impressions: impressions, clicks: clicks, purchases: purchases, revenue: revenue, ctr: ctr, cpc: cpc, cpm: cpm, cpa: cpa, roas: roas, cvr: cvr };
}

function groupSum(rows, keyFn) {
  var map = {};
  rows.forEach(function (r) {
    var k = keyFn(r);
    if (!map[k]) map[k] = [];
    map[k].push(r);
  });
  return map;
}

function rightsStatus(daysRemaining) {
  if (daysRemaining < 0) return 'Expired';
  if (daysRemaining <= 7) return 'Expiring within 7 days';
  if (daysRemaining <= 30) return 'Expiring within 30 days';
  return 'Active';
}

;
function groupMetricsByDimension(data, dimKey, excludeValue) {
  var creativeById = {};
  data.creatives.forEach(function (cv) { creativeById[cv.id] = cv; });
  var buckets = {};
  data.dailyRows.forEach(function (r) {
    var cv = creativeById[r.creativeId];
    var val = cv[dimKey];
    if (excludeValue && val === excludeValue) return;
    if (!buckets[val]) buckets[val] = [];
    buckets[val].push(r);
  });
  var out = {};
  Object.keys(buckets).forEach(function (k) { out[k] = aggregate(buckets[k]); });
  return out;
}

function pctDiff(a, b) {
  if (!b) return null;
  return ((a - b) / Math.abs(b)) * 100;
}

function bestKey(groupMap, metric, higherIsBetter) {
  var keys = Object.keys(groupMap);
  if (!keys.length) return null;
  keys.sort(function (a, b) {
    var d = groupMap[a][metric] - groupMap[b][metric];
    return higherIsBetter ? -d : d;
  });
  return keys[0];
}
function worstKey(groupMap, metric, higherIsBetter) {
  return bestKey(groupMap, metric, !higherIsBetter);
}

function generateInsights(data) {
  var insights = [];

  // 1. Hooks — CTR
  var byHook = groupMetricsByDimension(data, 'hook');
  var bestHook = bestKey(byHook, 'ctr', true), worstHook = worstKey(byHook, 'ctr', true);
  if (bestHook && worstHook && bestHook !== worstHook) {
    var diff1 = pctDiff(byHook[bestHook].ctr, byHook[worstHook].ctr);
    insights.push({
      category: 'Hooks',
      text: bestHook + ' hooks generated ' + Math.round(diff1) + '% higher CTR than ' + worstHook.toLowerCase() + ' hooks.',
      detail: (byHook[bestHook].ctr * 100).toFixed(2) + '% CTR vs ' + (byHook[worstHook].ctr * 100).toFixed(2) + '%',
      magnitude: Math.abs(diff1)
    });
  }

  // 2. Angles — CPA (lower is better)
  var byAngle = groupMetricsByDimension(data, 'angle');
  var bestAngle = bestKey(byAngle, 'cpa', false), worstAngle = worstKey(byAngle, 'cpa', false);
  if (bestAngle && worstAngle && bestAngle !== worstAngle) {
    var diff2 = pctDiff(byAngle[worstAngle].cpa, byAngle[bestAngle].cpa);
    insights.push({
      category: 'Angles',
      text: bestAngle + ' angles produced ' + Math.round(diff2) + '% lower CPA than ' + worstAngle.toLowerCase() + ' angles.',
      detail: '$' + byAngle[bestAngle].cpa.toFixed(2) + ' CPA vs $' + byAngle[worstAngle].cpa.toFixed(2),
      magnitude: Math.abs(diff2)
    });
  }

  // 3. Creators — CPA vs account average
  var overall = aggregate(data.dailyRows);
  var byCreator = groupMetricsByDimension(data, 'creatorId');
  var creatorNames = {};
  data.creators.forEach(function (c) { creatorNames[c.id] = c.name; });
  var bestCreator = bestKey(byCreator, 'cpa', false);
  if (bestCreator) {
    var diff3 = pctDiff(overall.cpa, byCreator[bestCreator].cpa);
    insights.push({
      category: 'Creators',
      text: creatorNames[bestCreator] + ' generated ' + Math.round(diff3) + '% lower CPA than the account average.',
      detail: '$' + byCreator[bestCreator].cpa.toFixed(2) + ' vs $' + overall.cpa.toFixed(2) + ' average',
      magnitude: Math.abs(diff3)
    });
  }

  // 4. Formats — CTR
  var byFormat = groupMetricsByDimension(data, 'format');
  var bestFormat = bestKey(byFormat, 'ctr', true), worstFormat = worstKey(byFormat, 'ctr', true);
  if (bestFormat && worstFormat && bestFormat !== worstFormat) {
    var diff4 = pctDiff(byFormat[bestFormat].ctr, byFormat[worstFormat].ctr);
    insights.push({
      category: 'Formats',
      text: bestFormat + ' creative generated ' + Math.round(diff4) + '% higher CTR than ' + worstFormat.toLowerCase() + '.',
      detail: (byFormat[bestFormat].ctr * 100).toFixed(2) + '% CTR vs ' + (byFormat[worstFormat].ctr * 100).toFixed(2) + '%',
      magnitude: Math.abs(diff4)
    });
  }

  // 5. Video length — lowest average CPA (superlative, excluding n/a for static formats)
  var byLength = groupMetricsByDimension(data, 'lengthBucket', 'n/a');
  var bestLength = bestKey(byLength, 'cpa', false);
  if (bestLength) {
    insights.push({
      category: 'Video length',
      text: bestLength + ' videos generated the lowest average CPA, at $' + byLength[bestLength].cpa.toFixed(2) + '.',
      detail: 'Across ' + Object.keys(byLength).length + ' length groups tested',
      magnitude: 100 - (byLength[bestLength].cpa / overall.cpa) * 100
    });
  }

  // 6. CTAs — CTR
  var byCta = groupMetricsByDimension(data, 'cta');
  var bestCta = bestKey(byCta, 'ctr', true), worstCta = worstKey(byCta, 'ctr', true);
  if (bestCta && worstCta && bestCta !== worstCta) {
    var diff6 = pctDiff(byCta[bestCta].ctr, byCta[worstCta].ctr);
    insights.push({
      category: 'CTAs',
      text: '"' + bestCta + '" CTAs generated ' + Math.round(diff6) + '% higher CTR than "' + worstCta + '".',
      detail: (byCta[bestCta].ctr * 100).toFixed(2) + '% CTR vs ' + (byCta[worstCta].ctr * 100).toFixed(2) + '%',
      magnitude: Math.abs(diff6)
    });
  }

  // 7. Campaigns — ROAS vs account average
  var byCampaign = groupMetricsByDimension(data, 'campaignId');
  var campaignNames = {};
  data.campaigns.forEach(function (c) { campaignNames[c.id] = c.name; });
  var bestCampaign = bestKey(byCampaign, 'roas', true);
  if (bestCampaign) {
    var diff7 = pctDiff(byCampaign[bestCampaign].roas, overall.roas);
    insights.push({
      category: 'Campaigns',
      text: campaignNames[bestCampaign] + ' is running ' + Math.round(Math.abs(diff7)) + '% ' + (diff7 >= 0 ? 'above' : 'below') + ' the account average ROAS.',
      detail: byCampaign[bestCampaign].roas.toFixed(2) + 'x vs ' + overall.roas.toFixed(2) + 'x average',
      magnitude: Math.abs(diff7)
    });
  }

  insights.sort(function (a, b) { return b.magnitude - a.magnitude; });
  return insights;
}

function generateAlerts(data) {
  var alerts = [];
  var overall = aggregate(data.dailyRows);
  var cvById = {}; data.creatives.forEach(function (c) { cvById[c.id] = c; });

  // creatives above 1.3x average CPA
  var creativeMetrics = data.creatives.map(function (cv) {
    var rows = data.dailyRows.filter(function (r) { return r.creativeId === cv.id; });
    return Object.assign({}, cv, aggregate(rows));
  });
  var highCpaCount = creativeMetrics.filter(function (c) { return c.cpa > overall.cpa * 1.3 && c.spend > 100; }).length;
  if (highCpaCount > 0) {
    alerts.push({ level: 'warn', text: highCpaCount + ' creative' + (highCpaCount === 1 ? '' : 's') + ' running above target CPA (over $' + Math.round(overall.cpa * 1.3) + ').' });
  }

  var lowRoasCount = creativeMetrics.filter(function (c) { return c.roas < 2 && c.spend > 100; }).length;
  if (lowRoasCount > 0) {
    alerts.push({ level: 'warn', text: lowRoasCount + ' creative' + (lowRoasCount === 1 ? '' : 's') + ' running below 2x ROAS.' });
  }

  var expiringSoon = data.rights.filter(function (r) { return r.daysRemaining <= 7; }).length;
  if (expiringSoon > 0) {
    alerts.push({ level: 'danger', text: expiringSoon + ' usage rights expiring or expired within 7 days.' });
  }

  data.campaigns.forEach(function (camp) {
    var rows = data.dailyRows.filter(function (r) { return r.campaignId === camp.id; });
    var agg = aggregate(rows);
    if (agg.spend > camp.budget) {
      alerts.push({ level: 'danger', text: camp.name + ' has spent ' + Math.round((agg.spend / camp.budget) * 100) + '% of budget.' });
    }
  });

  if (!alerts.length) {
    alerts.push({ level: 'ok', text: 'No performance alerts — all campaigns are within target ranges.' });
  }
  return alerts;
}

function aggMap(rows, keyFn) {
  var groups = groupSum(rows, keyFn);
  var out = {};
  Object.keys(groups).forEach(function (k) { out[k] = aggregate(groups[k]); });
  return out;
}

function enrichDemoData(raw) {
  raw.creatorMetrics = aggMap(raw.dailyRows, function (r) { return r.creatorId; });
  raw.campaignMetrics = aggMap(raw.dailyRows, function (r) { return r.campaignId; });
  raw.creativeMetrics = aggMap(raw.dailyRows, function (r) { return r.creativeId; });
  raw.adMetrics = aggMap(raw.dailyRows, function (r) { return r.adId; });
  var byDate = groupSum(raw.dailyRows, function (r) { return r.date; });
  raw.dateSeries = Object.keys(byDate).sort().map(function (d) {

    return Object.assign({ date: d }, m);
  });
  raw.overall = aggregate(raw.dailyRows);
  raw.insights = generateInsights(raw);

  return raw;
}


function buildEvidenceInsights(data) {
  var overall = aggregate(data.dailyRows);
  var creatorById = {}; data.creators.forEach(function(c){ creatorById[c.id]=c; });
  var dimensions = [
    { key:'hook', label:'Hook', metric:'ctr', higher:true },
    { key:'angle', label:'Angle', metric:'cpa', higher:false },
    { key:'format', label:'Format', metric:'roas', higher:true },
    { key:'cta', label:'CTA', metric:'ctr', higher:true },
    { key:'lengthBucket', label:'Video length', metric:'cpa', higher:false, exclude:'n/a' }
  ];
  var out=[];
  dimensions.forEach(function(dim){
    var groups=groupMetricsByDimension(data, dim.key, dim.exclude);
    var keys=Object.keys(groups).filter(function(k){ return groups[k].spend>=100 && groups[k].impressions>=1000; });
    if(keys.length<2) return;
    keys.sort(function(a,b){ return dim.higher ? groups[b][dim.metric]-groups[a][dim.metric] : groups[a][dim.metric]-groups[b][dim.metric]; });
    var win=keys[0], base=aggregate(data.dailyRows), delta=dim.metric==='ctr' ? pctDiff(groups[win].ctr,base.ctr) : pctDiff(groups[win][dim.metric],base[dim.metric]);
    var quality=groups[win].spend>=500 && groups[win].purchases>=10 ? 'strong' : (groups[win].spend>=250 ? 'moderate':'directional');
    out.push({category:dim.label, winner:win, metric:dim.metric, value:groups[win][dim.metric], baseline:base[dim.metric], delta:delta, spend:groups[win].spend, purchases:groups[win].purchases, sampleSize:groups[win].impressions, quality:quality});
  });
  var byCreator=groupMetricsByDimension(data,'creatorId');
  Object.keys(byCreator).forEach(function(id){
    var m=byCreator[id]; if(m.spend<250 || !m.purchases) return;
    var delta=pctDiff(overall.cpa,m.cpa);
    if(delta!==null && Math.abs(delta)>=10) out.push({category:'Creator', winner:(creatorById[id]||{}).name||id, metric:'cpa', value:m.cpa, baseline:overall.cpa, delta:delta, spend:m.spend, purchases:m.purchases, sampleSize:m.impressions, quality:m.spend>=500?'strong':'moderate'});
  });
  return out.sort(function(a,b){ return Math.abs(b.delta||0)-Math.abs(a.delta||0); });
}
function buildRecommendations(data) {
  var evidence=buildEvidenceInsights(data), recs=[];
  evidence.slice(0,6).forEach(function(e){
    var direction=e.metric==='cpa' ? (e.value<e.baseline?'lower':'higher') : (e.value>e.baseline?'higher':'lower');
    var pct=Math.round(Math.abs(e.delta||0));
    recs.push({type:'Test', priority:e.quality==='strong'?'High':e.quality==='moderate'?'Medium':'Explore', title:'Test more '+String(e.winner).toLowerCase()+' '+e.category.toLowerCase(), body:e.category+' group shows '+pct+'% '+direction+' '+e.metric.toUpperCase()+' versus the blended baseline.', evidence:e});
  });
  var fatigue=[];
  data.creatives.forEach(function(cv){
    var rows=data.dailyRows.filter(function(r){return r.creativeId===cv.id;});
    if(rows.length<14) return;
    var sorted=rows.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
    var mid=Math.floor(sorted.length/2), first=aggregate(sorted.slice(0,mid)), last=aggregate(sorted.slice(mid));
    if(first.ctr>0 && last.ctr<first.ctr*0.75 && last.spend>100) fatigue.push({cv:cv, drop:pctDiff(last.ctr,first.ctr), spend:last.spend});
  });
  fatigue.sort(function(a,b){return a.drop-b.drop;});
  fatigue.slice(0,3).forEach(function(x){recs.push({type:'Refresh',priority:'High',title:'Refresh '+x.cv.id+' creative',body:'CTR declined '+Math.round(Math.abs(x.drop))+'% between the first and second half of its observed run.',evidence:{creative:x.cv.id,ctrDrop:x.drop,spend:x.spend}});});
  return recs;
}

function sortRows(rows, sortState, columns) {
  var col = columns.filter(function (c) { return c.key === sortState.key; })[0];
  var getVal = col && col.sortValue ? col.sortValue : function (r) { return r[sortState.key]; };
  return rows.slice().sort(function (a, b) {
    var va = getVal(a), vb = getVal(b), cmp;
    if (typeof va === 'string') cmp = va.localeCompare(vb); else cmp = (va - vb);
    return sortState.dir === 'asc' ? cmp : -cmp;
  });
}

function tableHTML(columns, rows, sortState, rowIdKey, emptyMsg) {
  if (!rows.length) return '<div class="empty">' + (emptyMsg || 'No data to show.') + '</div>';
  var thead = '<thead><tr>' + columns.map(function (c) {
    var arrow = sortState && sortState.key === c.key ? (sortState.dir === 'asc' ? ' \u25B2' : ' \u25BC') : '';
    return '<th data-sort-key="' + c.key + '" style="text-align:' + (c.align || 'right') + '">' + escapeHtml(c.label) + '<span class="arrow">' + arrow + '</span></th>';
  }).join('') + '</tr></thead>';
  var tbody = '<tbody>' + rows.map(function (r) {
    var rowAttr = rowIdKey ? ' data-row-id="' + escapeHtml(r[rowIdKey]) + '" class="clickable-row"' : '';
    return '<tr' + rowAttr + '>' + columns.map(function (c) {
      var val = c.format ? c.format(r) : escapeHtml(r[c.key]);
      return '<td style="text-align:' + (c.align || 'right') + '">' + val + '</td>';
    }).join('') + '</tr>';
  }).join('') + '</tbody>';
  return '<div class="table-wrap"><table>' + thead + tbody + '</table></div>';
}

function wireTable(container, sortState, rerender, onRowClick) {
  container.querySelectorAll('[data-sort-key]').forEach(function (th) {
    th.addEventListener('click', function () {
      var key = th.getAttribute('data-sort-key');
      if (sortState.key === key) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
      else { sortState.key = key; sortState.dir = 'desc'; }
      rerender();
    });
  });
  if (onRowClick) {
    container.querySelectorAll('.clickable-row').forEach(function (tr) {
      tr.addEventListener('click', function () { onRowClick(tr.getAttribute('data-row-id')); });
    });
  }
}

  var container = document.getElementById('pageContent');
  var mod = PAGES[App.page];
  if (!mod) { container.innerHTML = '<div class="empty">Page not found.</div>'; return; }
  container.innerHTML = mod.render();
  if (mod.mount) mod.mount(container);
}

function noDataState(what) {
  return '<div class="empty big">' +
    '<p><strong>No data loaded yet.</strong></p>' +
    '<p>Load the sample dataset to explore ' + escapeHtml(what) + ', or upload your own CSV for a flat creator-level view.</p>' +
    '<button class="primary" onclick="document.getElementById(\'btnSample\').click()">Load sample data</button>' +
    '</div>';
}

function csvModeState(what) {
  return '<div class="empty big">' +
    '<p><strong>Not available in CSV mode.</strong></p>' +
    '<p>' + escapeHtml(what) + ' needs the full demo dataset (creators \u2192 creatives \u2192 campaigns \u2192 ads).</p>' +
    '<button class="primary" onclick="document.getElementById(\'btnSample\').click()">Load sample data</button>' +
    '</div>';
}

PAGES.overview = {

    var d = App.data, o = d.overall;
    var kpis = [
      kpiCard('Spend', fmtCurrency(o.spend)),
      kpiCard('Revenue', fmtCurrency(o.revenue)),
      kpiCard('Purchases', fmtNum(o.purchases)),
      kpiCard('CPA', fmtCurrency2(o.cpa)),
      kpiCard('ROAS', fmtX(o.roas)),
      kpiCard('CTR', fmtPct(o.ctr)),
      kpiCard('CPC', fmtCurrency2(o.cpc)),
      kpiCard('Conversion rate', fmtPct1(o.cvr))
    ].join('');

    var body;
    if (App.mode === 'csv') {
      body = '<section><h2>Creators</h2>' + csvModeState('Time series and creative-level views') + '</section>';

      body =
        '<section><div class="charts-grid">' +

        '</div></section>' +
        '<section><div class="charts-grid">' +
        '<div class="chart-card"><div class="chart-title">Top creators by revenue</div>' +
        '<div class="chart-body"><canvas id="ovTopCreators" role="img" aria-label="Bar chart of top creators by revenue"></canvas></div></div>' +
        '<div class="chart-card"><div class="chart-title">Top creatives by ROAS</div>' +
        '<div class="chart-body"><canvas id="ovTopCreatives" role="img" aria-label="Bar chart of top creatives by ROAS"></canvas></div></div>' +
        '</div></section>' +
        '<section><div class="charts-grid">' +
        '<div class="chart-card"><div class="chart-title">Performance alerts</div>' + renderAlertsList(d.alerts) + '</div>' +
        '<div class="chart-card"><div class="chart-title">Creative intelligence summary</div>' + renderInsightsSummary(d.insights) + '</div>' +
        '</div></section>';
    }
    return pageHeader('Overview', 'Account-wide performance across every creator, creative and campaign.') + kpis + body;
  },
  mount: function () {
    if (!isFullMode()) return;
    var d = App.data, colors = themeColors();

    var labels = d.dateSeries.map(function (r) { return fmtDateShort(r.date); });
    App.charts.ovSpendRev = new Chart(document.getElementById('ovSpendRevChart'), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          { label: 'Spend', data: d.dateSeries.map(function (r) { return round2(r.spend); }), borderColor: colors.neg, backgroundColor: colors.neg + '22', borderWidth: 2, pointRadius: 0, tension: 0.25 },
          { label: 'Revenue', data: d.dateSeries.map(function (r) { return round2(r.revenue); }), borderColor: colors.pos, backgroundColor: colors.pos + '22', borderWidth: 2, pointRadius: 0, tension: 0.25 }
        ]
      },
      options: chartOptsLine(colors)
    });

    App.charts.ovPurchases = new Chart(document.getElementById('ovPurchasesChart'), {
      type: 'bar',
      data: { labels: labels, datasets: [{ label: 'Purchases', data: d.dateSeries.map(function (r) { return r.purchases; }), backgroundColor: colors.accent, borderRadius: 3, maxBarThickness: 16 }] },
      options: chartOptsLine(colors, true)
    });

    var topCreators = d.creators.map(function (c) { return Object.assign({ name: c.name }, d.creatorMetrics[c.id] || {}); })
      .sort(function (a, b) { return b.revenue - a.revenue; }).slice(0, 5);
    App.charts.ovTopCreators = new Chart(document.getElementById('ovTopCreators'), {
      type: 'bar',
      data: { labels: topCreators.map(function (c) { return c.name; }), datasets: [{ label: 'Revenue', data: topCreators.map(function (c) { return round2(c.revenue); }), backgroundColor: colors.pos, borderRadius: 4, maxBarThickness: 22 }] },
      options: chartOptsHBar(colors)
    });

    var topCreatives = d.creatives.map(function (cv) { return Object.assign({ label: cv.id }, d.creativeMetrics[cv.id] || {}); })
      .filter(function (c) { return c.spend > 50; })
      .sort(function (a, b) { return b.roas - a.roas; }).slice(0, 5);
    App.charts.ovTopCreatives = new Chart(document.getElementById('ovTopCreatives'), {
      type: 'bar',
      data: { labels: topCreatives.map(function (c) { return c.label; }), datasets: [{ label: 'ROAS', data: topCreatives.map(function (c) { return round2(c.roas); }), backgroundColor: colors.accent, borderRadius: 4, maxBarThickness: 22 }] },
      options: chartOptsHBar(colors, 'x')
    });
  }
};

function pageHeader(title, subtitle, actionsHtml) {
  return '<div class="page-head"><div><h1>' + escapeHtml(title) + '</h1><p class="sub">' + escapeHtml(subtitle) + '</p></div>' +
    '<div class="page-actions">' + (actionsHtml || '') + '</div></div>';
}

function renderAlertsList(alerts) {
  if (!alerts || !alerts.length) return '<div class="empty">No alerts.</div>';
  return '<ul class="alert-list">' + alerts.map(function (a) {
    return '<li class="alert alert-' + a.level + '">' + escapeHtml(a.text) + '</li>';
  }).join('') + '</ul>';
}

function renderInsightsSummary(insights) {
  if (!insights || !insights.length) return '<div class="empty">No insights yet.</div>';
  return '<ul class="insight-list">' + insights.slice(0, 3).map(function (i) {
    return '<li><span class="insight-cat">' + escapeHtml(i.category) + '</span>' + escapeHtml(i.text) + '</li>';
  }).join('') + '</ul><button class="link-btn" data-page="intelligence" onclick="setPage(\'intelligence\',{})">View all insights \u2192</button>';
}

function chartOptsLine(colors, isBar) {
  return {

    scales: {
      x: { ticks: { color: colors.text, maxRotation: 0, autoSkip: true, font: { size: 10 } }, grid: { display: false } },
      y: { ticks: { color: colors.text, font: { size: 10 } }, grid: { color: colors.grid } }
    }
  };
}

    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: colors.text, font: { size: 10 } }, grid: { color: colors.grid } },
