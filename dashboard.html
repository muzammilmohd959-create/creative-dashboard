<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARKFLUENCE — Creator Performance OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/daisyui@5/components/aura.css" rel="stylesheet" type="text/css">
</head>
<body>
<div id="authGate"></div>
<div class="app-shell auth-hidden">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span>ARKFLUENCE</div>
    <div id="modeIndicator" class="mode-badge"></div>
    <nav id="sidebarNav"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left"></div>
      <div class="topbar-actions">
        <button id="btnSample">Load sample</button>
        <button id="btnUpload" class="primary">Upload CSV</button>
        <button id="btnClear">Clear data</button>
        <button id="btnLogout" class="auth-logout" style="display:none;">Log out</button>
        <input type="file" id="fileInput" accept=".csv">
      </div>
    </div>
    <div class="content" id="pageContent"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<script src="src_page-shell-overview.js"></script>
<script src="src_page-creators.js"></script>
<script src="src_page-creatives.js"></script>
<script src="src_page-campaigns.js"></script>
<script src="src_page-ads.js"></script>
<script src="src_page-intelligence.js"></script>
<script src="src_page-rights.js"></script>
<script src="src_page-reports.js"></script>
<script src="src_page-settings.js"></script>
<script src="src_page-creative-ops.js"></script>
<script src="src_page-recommendations.js"></script>
<script src="src_page-pattern-explorer.js"></script>
<script src="src_page-creative-scorecard.js"></script>
<script src="src_page-comparison-insights.js"></script>
<script src="src_boot.js"></script>
