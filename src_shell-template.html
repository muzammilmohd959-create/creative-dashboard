<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
__STYLES__
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span>Creator Performance</div>
    <div id="modeIndicator" class="mode-badge"></div>
    <nav id="sidebarNav"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left"></div>
      <div class="topbar-actions">
        <button id="btnSample">Load sample data</button>
        <button id="btnUpload" class="primary">Upload CSV</button>
        <button id="btnClear">Clear</button>
        <input type="file" id="fileInput" accept=".csv">
      </div>
    </div>
    <div class="content" id="pageContent"></div>
  </div>
</div>

<script>
window.addEventListener('error', function(e) {
  try {
    var el = document.getElementById('pageContent');
    if (el && !el.innerHTML.trim()) {
      el.innerHTML = '<div style="padding:32px;font-family:system-ui"><h2>Dashboard startup error</h2><p>' +
        String(e.message || 'Unknown JavaScript error').replace(/[&<>]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}) +
        '</p><p style="color:#8B93A3">Open browser console for the exact file and line.</p></div>';
    }
  } catch (_) {}
});
window.addEventListener('unhandledrejection', function(e) {
  try {
    var el = document.getElementById('pageContent');
    if (el && !el.innerHTML.trim()) {
      el.innerHTML = '<div style="padding:32px;font-family:system-ui"><h2>Dashboard startup error</h2><p>' +
        String((e.reason && e.reason.message) || e.reason || 'Unhandled promise rejection').replace(/[&<>]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}) +
        '</p></div>';
    }
  } catch (_) {}
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script>
__SCRIPT__
</script>
</body>
</html>
